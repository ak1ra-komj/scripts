# Read-only RBAC presets for a namespace.
#
# Usage:
#   kubectl -n <namespace> apply -f readers.yaml
#   kubectl -n <namespace> apply --dry-run=client -f readers.yaml -o yaml
#
# Namespace is intentionally omitted so -n controls placement.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svc-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: svc-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: svc-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: svc-reader
subjects:
  - kind: ServiceAccount
    name: svc-reader
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deploy-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "statefulsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deploy-reader
subjects:
  - kind: ServiceAccount
    name: deploy-reader
